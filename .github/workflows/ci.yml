name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Cuts a large chunk off cold Windows builds, which are the slow leg of the matrix.
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Windows and Linux fail for different reasons; seeing only the first is useless.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux backend is webkit2gtk; there is no equivalent step on Windows,
      # where WebView2 ships with the OS.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf

      # conduit-fs generates WinFsp bindings against the installed SDK (Developer
      # feature = ADDLOCAL=ALL) and needs libclang; the runner image ships LLVM.
      # Installed from the upstream MSI rather than Chocolatey, whose community feed
      # rate-limits CI runners (HTTP 499 → "package was not found").
      - name: Install WinFsp SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = "$env:RUNNER_TEMP\winfsp.msi"
          Invoke-WebRequest -Uri "https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi" -OutFile $msi
          $p = Start-Process msiexec -ArgumentList "/i", $msi, "/qn", "ADDLOCAL=ALL" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "WinFsp install failed with exit code $($p.ExitCode)" }
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -Append $env:GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Must run before any cargo command: tauri-build resolves `frontendDist`
      # (ui/dist) at build time and fails if it does not exist.
      - name: Build frontend
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
