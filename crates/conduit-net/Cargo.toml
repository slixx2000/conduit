[package]
name = "conduit-net"
description = "Pluggable link layer: enumerate, rank, and select the IP link Conduit transfers over."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# GetAdaptersAddresses wrapper: adapter descriptions, gateways, and link speeds are
# how Windows adapters are classified into transports.
ipconfig = "0.3"

[target.'cfg(not(windows))'.dependencies]
if-addrs = "0.13"

[dev-dependencies]
tempfile = "3"
tokio.workspace = true
